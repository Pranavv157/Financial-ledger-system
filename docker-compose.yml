services:

  db:
    image: postgres:16
    environment:
      POSTGRES_DB: ledger
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres

    ports:
      - "5432:5432"

  redis:
    image: redis:7
    ports:
      - "6379:6379"

  web:
    build: .
    command: python manage.py runserver 0.0.0.0:8000

    ports:
      - "8000:8000"

    env_file:
      - .env

    depends_on:
      - db
      - redis

  worker:
    build: .
    command: celery -A config worker --pool=threads --concurrency=20 -l info

    env_file:
      - .env

    depends_on:
      - redis
      - db